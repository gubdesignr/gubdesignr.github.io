 {% assign sorted_products = site.products | sort: "order" %}
{% for product in sorted_products %}

        <div class="modal-content">
            <div class="close-modal" data-dismiss="modal">
                <div class="lr">
                    <div class="rl">
                    </div>
                </div>
            </div>
            <div class="container">
                <div class="row">
                    <div class="col-lg-8 col-lg-offset-2">
                        <div class="modal-body">
                            <h2>{{ product.title }}</h2>
                            <hr class="star-primary">
                            <img src="img/products/{{ product.img }}" class="img-responsive img-centered" alt="{{ product.alt }}">
                            <p>{{ product.description }}</p>

   <div class="buy-row-wrapper">

  <!-- DIY Option -->
  <div class="buy-option">
    <p class="title">Without Build</p>
    <p class="price">£550</p>

    <form id="form-diy" method="GET" target="_blank">
      <label for="region-diy">📍 Select your region</label>
      <select id="region-diy" onchange="updateFormLink(this, 'diy')" required>
        <option value="">Choose your shipping region</option>
        
        <option value="uk" data-link="https://buy.stripe.com/test_diy_uk">🇬🇧 United Kingdom – £20</option>

        <option value="eu" data-link="https://buy.stripe.com/test_diy_eu">🇪🇺 Europe – £52.10</option>
        <option disabled> 🇩🇪 Germany 🇫🇷 France 🇪🇸 Spain 🇮🇹 Italy</option>

        <option value="scandi" data-link="https://buy.stripe.com/test_diy_scandi">🇩🇰 Scandinavia – £62</option>
        <option disabled> 🇳🇴 Norway 🇸🇪 Sweden 🇫🇮 Finland</option>

        <option value="apac" data-link="https://buy.stripe.com/test_diy_apac">🌏 Asia-Pacific – £65</option>
        <option disabled> 🇸🇬 Singapore 🇭🇰 Hong Kong 🇹🇭 Thailand 🇦🇺 Australia 🇳🇿 New Zealand</option>

        <option value="na" data-link="https://buy.stripe.com/test_diy_na">🌎 North America – £80</option>
        <option disabled> 🇺🇸 USA 🇨🇦 Canada</option>
      </select>

      <br>
      <button class="btn-buy">Buy Now</button>
    </form>
  </div>

  <div class="divider"></div>

  <!-- Built Option -->
  <div class="buy-option">
    <p class="title">With Build</p>
    <p class="price">£800</p>

    <form id="form-built" method="GET" target="_blank">
      <label for="region-built">📍 Select your region</label>
      <select id="region-built" onchange="updateFormLink(this, 'built')" required>
        <option value="">Choose your shipping region</option>

        <option value="uk" data-link="https://buy.stripe.com/test_built_uk">🇬🇧 United Kingdom – £20</option>

        <option value="eu" data-link="https://buy.stripe.com/test_built_eu">🇪🇺 Europe – £52.10</option>
        <option disabled> 🇩🇪 Germany 🇫🇷 France 🇪🇸 Spain 🇮🇹 Italy</option>

        <option value="scandi" data-link="https://buy.stripe.com/test_built_scandi">🇩🇰 Scandinavia – £62</option>
        <option disabled> 🇳🇴 Norway 🇸🇪 Sweden 🇫🇮 Finland</option>

        <option value="apac" data-link="https://buy.stripe.com/test_built_apac">🌏 Asia-Pacific – £65</option>
        <option disabled> 🇸🇬 Singapore 🇭🇰 Hong Kong 🇹🇭 Thailand 🇦🇺 Australia 🇳🇿 New Zealand</option>

        <option value="na" data-link="https://buy.stripe.com/test_built_na">🌎 North America – £80</option>
        <option disabled> 🇺🇸 USA 🇨🇦 Canada</option>
      </select>

      <br>
      <button class="btn-buy">Buy Now</button>
    </form>
  </div>
</div>


<!-- Line break for spacing between buttons -->
<br><br>

<!-- Close button -->
<button type="button" class="btn btn-default btn-divider-centered" data-dismiss="modal"><i class="fa fa-times"></i> Close</button> 
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
{% endfor %}
