 {% assign sorted_products = site.products | sort: "order" %}
{% for product in sorted_products %}
    <div class="product-modal modal fade" id="products-{{ product.modal-id }}" tabindex="-1" role="dialog" aria-hidden="true">
        <div class="modal-content">
            <div class="close-modal" data-dismiss="modal">
                <div class="lr">
                    <div class="rl">
                    </div>
                </div>
            </div>
            <div class="container">
                <div class="row">
                    <div class="col-lg-8 col-lg-offset-2">
                        <div class="modal-body">
                            <h2>{{ product.title }}</h2>
                            <hr class="star-primary">
                            <img src="img/products/{{ product.img }}" class="img-responsive img-centered" alt="{{ product.alt }}">
                            <p>{{ product.description }}</p>

 <div class="buy-row-wrapper">
  <!-- DIY Option -->
  <div class="buy-option">
    <p class="title">Without Build</p>
    <p class="price">{{ product.price_diy }}</p>
    <form action="{{ product.link_diy }}" method="POST" target="_blank">
      <button class="btn-buy">Buy Now</button>
    </form>
    <!-- Dropdown below DIY button -->
    <select class="shipping-select">
      <option>🇬🇧 United Kingdom & Northern Ireland – £20</option>

      <optgroup label="🌏 Asia-Pacific - £65">

        <option>🇦🇺 Australia</option>

    </select>
  </div>
