 
 <!-- Portfolio Modals random comment for rebuild-->
 {% assign sorted_products = site.products | sort: "order" %}
{% for product in sorted_products %}
    <div class="product-modal modal fade" id="products-{{ product.modal-id }}" tabindex="-1" role="dialog" aria-hidden="true">
        <div class="modal-content">
            <div class="close-modal" data-dismiss="modal">
                <div class="lr">
                    <div class="rl">
                    </div>
                </div>
            </div>
            <div class="container">
                <div class="row">
                    <div class="col-lg-8 col-lg-offset-2">
                        <div class="modal-body">
                            <h2>{{ product.title }}</h2>
                            <hr class="star-primary">
                            <img src="img/products/{{ product.img }}" class="img-responsive img-centered" alt="{{ product.alt }}">
                            <p>{{ product.description }}</p>

   <div class="buy-option">
  <p class="title">Without Build</p>
  <p class="price">{{ product.price_diy }}</p>

  <!-- Region dropdown -->
  <select id="diy-select-{{ product.modal-id }}" class="region-select">
    <option value="">Select your region 📍</option>
    <optgroup label="🇬🇧 UK – £20">
      <option value="{{ product.link_diy_uk }}">🇬🇧 United Kingdom</option>
    </optgroup>
    <optgroup label="🌏 Asia-Pacific – £65">
      <option value="{{ product.link_diy_apac }}">🇸🇬 Singapore</option>
      <option value="{{ product.link_diy_apac }}">🇭🇰 Hong Kong</option>
      <option value="{{ product.link_diy_apac }}">🇹🇭 Thailand</option>
      <option value="{{ product.link_diy_apac }}">🇦🇺 Australia</option>
      <option value="{{ product.link_diy_apac }}">🇳🇿 New Zealand</option>
    </optgroup>
    <optgroup label="🇪🇺 Europe – £52.10">
      <option value="{{ product.link_diy_europe }}">🇩🇪 Germany</option>
      <option value="{{ product.link_diy_europe }}">🇫🇷 France</option>
      <option value="{{ product.link_diy_europe }}">🇪🇸 Spain</option>
      <option value="{{ product.link_diy_europe }}">🇮🇹 Italy</option>
    </optgroup>
    <optgroup label="🇪🇺 Scandinavia – £62">
      <option value="{{ product.link_diy_scandinavia }}">🇩🇰 Denmark</option>
      <option value="{{ product.link_diy_scandinavia }}">🇳🇴 Norway</option>
      <option value="{{ product.link_diy_scandinavia }}">🇸🇪 Sweden</option>
      <option value="{{ product.link_diy_scandinavia }}">🇫🇮 Finland</option>
    </optgroup>
    <optgroup label="🌎 North America – £80">
      <option value="{{ product.link_diy_na }}">🇨🇦 Canada</option>
      <option value="{{ product.link_diy_na }}">🇺🇸 USA</option>
    </optgroup>
  </select>

  <!-- Buy button -->
  <button class="btn-buy" onclick="
    const sel = document.getElementById('diy-select-{{ product.modal-id }}');
    if (sel.value) {
      window.open(sel.value, '_blank');
    } else {
      alert('Please select your region first.');
    }
  ">
    Buy Now
  </button>
</div>


<div class="divider"></div>

     <!-- Built Option -->
  <div class="buy-option">
    <p class="title">With Build</p>
    <p class="price">{{ product.price_built }}</p>
    <form action="{{ product.link_built }}" method="POST" target="_blank">
      <button class="btn-buy">Buy Now</button>
    </form>
  </div>
</div>


<!-- Line break for spacing between buttons -->
<br><br>

<!-- Close button -->
<button type="button" class="btn btn-default btn-divider-centered" data-dismiss="modal"><i class="fa fa-times"></i> Close</button> 
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
{% endfor %}
