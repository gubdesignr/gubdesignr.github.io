            <div class="close-modal" data-dismiss="modal">
                <div class="lr">
                    <div class="rl">
                    </div>
                </div>
            </div>
            <div class="container">
                <div class="row">
                    <div class="col-lg-8 col-lg-offset-2">
                        <div class="modal-body">
                            <h2>{{ post.title }}</h2>
                            <hr class="star-primary">
                            <img src="img/portfolio/{{ post.img }}" class="img-responsive img-centered" alt="{{ post.alt }}">
                            <p>{{ post.description }}</p>

<div class="buy-row-wrapper" style="position: relative; margin-top: 10px;">
  <!-- Divider Line -->
  <div style="
    position: absolute;
    top: 0;
    bottom: 0;
    left: 50%;
    width: 1px;
    background-color: #ccc;
    transform: translateX(-50%);
  "></div>

  <!-- Stripe Buy Buttons -->
  <div class="row text-center">
    <!-- Without Build -->
    <div class="col-sm-6">
      <div class="buy-col">
        <p class="buy-title"><strong>Without Build</strong></p>
        <p class="buy-price">£XXX</p>
        <form action="https://buy.stripe.com/test_XXXXXXXXXX" method="POST">
          <button type="submit" class="btn btn-buy">Buy Now</button>
        </form>
      </div>
    </div>

    <!-- With Build -->
    <div class="col-sm-6">
      <div class="buy-col">
        <p class="buy-title"><strong>With Build</strong></p>
        <p class="buy-price">£XXX</p>
        <form action="https://buy.stripe.com/test_YYYYYYYYYY" method="POST">
          <button type="submit" class="btn btn-buy">Buy Now</button>
        </form>
      </div>
    </div>
  </div>
</div>

<!-- Line break for spacing between buttons -->
<br><br>

<!-- Close button -->
<div class="text-center" style="margin-top: 20px;">
  <button type="button" class="btn btn-default" data-dismiss="modal">
    <i class="fa fa-times"></i> Close
  </button>
</div>    
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
{% endfor %}
