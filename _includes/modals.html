 <!-- Portfolio Modals -->
 {% for post in site.posts %}
    <div class="portfolio-modal modal fade" id="portfolioModal{{ post.modal-id }}" tabindex="-1" role="dialog" aria-hidden="true">
        <div class="modal-content">
            <div class="close-modal" data-dismiss="modal">
                <div class="lr">
                    <div class="rl">
                    </div>
                </div>
            </div>
            <div class="container">
                <div class="row">
                    <div class="col-lg-8 col-lg-offset-2">
                        <div class="modal-body">
                            <h2>{{ post.title }}</h2>
                            <hr class="star-primary">
                            <img src="img/portfolio/{{ post.img }}" class="img-responsive img-centered" alt="{{ post.alt }}">
                            <p>{{ post.description }}</p>

<!-- Stripe Buy Buttons -->
<div class="row text-center" style="margin-top: 10px;">
  <!-- Left option -->
  <div class="col-sm-6" style="padding: 0 20px;">
    <div style="display: flex; flex-direction: column; align-items: center;">
      <p style="margin-bottom: 4px;"><strong>Without Build</strong></p>
      <p style="margin-bottom: 8px;">£XXX</p>
      <form action="https://buy.stripe.com/test_XXXXXXXXXX" method="POST">
        <button type="submit" class="btn btn-buy">Buy Now</button>
      </form>
    </div>
  </div>

  <!-- Divider for desktop -->
  <div class="visible-sm visible-md visible-lg" style="position: absolute; top: 0; bottom: 60px; left: 50%; width: 1px; background-color: #ccc;"></div>

  <!-- Divider for mobile -->
  <div class="col-sm-12 visible-xs" style="margin: 15px 0;"><hr></div>

  <!-- Right option -->
  <div class="col-sm-6" style="padding: 0 20px;">
    <div style="display: flex; flex-direction: column; align-items: center;">
      <p style="margin-bottom: 4px;"><strong>With Build</strong></p>
      <p style="margin-bottom: 8px;">£XXX</p>
      <form action="https://buy.stripe.com/test_YYYYYYYYYY" method="POST">
        <button type="submit" class="btn btn-buy">Buy Now</button>
      </form>
    </div>
  </div>
</div>

                        <!-- Line break for spacing between buttons -->
                        <br><br>

<!-- Close button -->
<div class="text-center" style="margin-top: 20px;">
  <button type="button" class="btn btn-default" data-dismiss="modal">
    <i class="fa fa-times"></i> Close
  </button>
</div>                    
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
{% endfor %}
